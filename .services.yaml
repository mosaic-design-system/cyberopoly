services:
  - name: frontend
    path: ./frontend
    public: true
    aarepo: 592311462240.dkr.ecr.eu-west-2.amazonaws.com/cyberopoly/dev/cyberopoly
    origin: lovable
    dependsOn:
      private:
        - backend
  - name: backend
    path: ./backend
    public: false
    aarepo: 592311462240.dkr.ecr.eu-west-2.amazonaws.com/cyberopoly/dev/cyberopoly
    env:
      - ANTHROPIC_API_KEY
      - FRONTEND_URL

