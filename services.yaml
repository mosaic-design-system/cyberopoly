services:
  - name: frontend
    path: ./frontend
    public: true
    dockerfile: ./frontend/Dockerfile
    aarepo: 592311462240.dkr.ecr.eu-west-2.amazonaws.com/mds/dev/cyberopoly-frontend
    port: 8000

  - name: backend
    path: ./backend
    public: false
    dockerfile: ./backend/Dockerfile
    aarepo: 592311462240.dkr.ecr.eu-west-2.amazonaws.com/mds/dev/cyberopoly-backend
    port: 3001
    env:
      - ANTHROPIC_API_KEY
      - PORT=3001
      - FRONTEND_URL